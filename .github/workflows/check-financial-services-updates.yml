name: anthropics/financial-services 更新チェック

on:
  schedule:
    # 毎週月曜 09:00 JST (00:00 UTC) に実行
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run（Issue を作成しない）'
        required: false
        default: 'false'
        type: boolean

jobs:
  check-updates:
    name: financial-services の新規エージェント／プラグインをチェック
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 更新チェックスクリプトを実行
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRACKED_FILE: scripts/known-files.json
        run: python scripts/check_financial_services_updates.py

      - name: 追加・削除がある場合 Issue を作成
        if: (steps.check.outputs.has_new_items == 'true' || steps.check.outputs.has_removed_items == 'true') && inputs.dry_run != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('financial_services_report.json', 'utf8'));

            const sections = [];
            let total = 0;
            let totalRemoved = 0;
            for (const key of Object.keys(report)) {
              const { dir, label, new: added = [], removed = [] } = report[key];
              if (added.length === 0 && removed.length === 0) continue;
              total += added.length;
              totalRemoved += removed.length;
              const list = [
                ...added.map(s => `- 追加: [\`${s}\`](https://github.com/anthropics/financial-services/tree/main/${dir}/${s})`),
                ...removed.map(s => `- 削除: \`${s}\`（upstream に存在しない）`),
              ].join('\n');
              sections.push(`### ${label}（追加 ${added.length} 件・削除 ${removed.length} 件）\n\n${list}`);
            }

            const body = [
              `## anthropics/financial-services に追加・削除がありました`,
              ``,
              `[anthropics/financial-services](https://github.com/anthropics/financial-services) で、追加 **${total} 件**・削除 **${totalRemoved} 件**のエージェント／プラグインを検出しました。`,
              `[docs/business/financial-services.md](docs/business/financial-services.md) への反映を検討してください。`,
              ``,
              sections.join('\n\n'),
              ``,
              `---`,
              ``,
              `### 対応方法`,
              ``,
              `1. 追加は内容（README / SKILL.md / agent 定義）を確認し、\`docs/business/financial-services.md\` に解説を追加する`,
              `2. 削除は経緯（統合・改名・削除）を upstream の commit 履歴で確認し、該当する解説を外すか後継へ差し替える`,
              `3. \`scripts/known-files.json\` の該当リスト（\`financial_services_*\`）を更新する`,
              `4. \`CHANGELOG.md\` に更新内容を1行追記する`,
              ``,
              `> このIssueは [check-financial-services-updates](../../actions/workflows/check-financial-services-updates.yml) ワークフローにより自動生成されました。`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[更新通知] anthropics/financial-services に追加 ${total} 件・削除 ${totalRemoved} 件 (${new Date().toISOString().split('T')[0]})`,
              body,
              labels: ['upstream-update', 'documentation'],
            });

            console.log(`Issue created: ${total} new / ${totalRemoved} removed`);

      - name: 追加・削除なし（スキップ）
        if: steps.check.outputs.has_new_items != 'true' && steps.check.outputs.has_removed_items != 'true'
        run: echo "追加・削除はありませんでした。"