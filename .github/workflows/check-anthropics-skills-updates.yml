name: anthropics/skills 更新チェック

on:
  schedule:
    # 毎週月曜 09:00 JST (00:00 UTC) に実行
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run（Issue を作成しない）'
        required: false
        default: 'false'
        type: boolean

jobs:
  check-updates:
    name: anthropics/skills の新規スキルをチェック
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 更新チェックスクリプトを実行
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRACKED_FILE: scripts/known-files.json
        run: python scripts/check_anthropics_skills_updates.py

      - name: 追加・削除がある場合 Issue を作成
        if: (steps.check.outputs.has_new_skills == 'true' || steps.check.outputs.has_removed_skills == 'true') && inputs.dry_run != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('anthropics_skills_report.json', 'utf8'));
            const newSkills = report.new_skills || [];
            const removedSkills = report.removed_skills || [];

            const newList = newSkills.map(s =>
              `- [\`${s}\`](https://github.com/anthropics/skills/tree/main/skills/${s})`
            ).join('\n');
            const removedList = removedSkills.map(s => `- \`${s}\``).join('\n');

            const body = [
              `## anthropics/skills のスキルに追加・削除がありました`,
              ``,
              `[anthropics/skills](https://github.com/anthropics/skills) で、追加 **${newSkills.length} 件**・削除 **${removedSkills.length} 件**を検出しました。`,
              `[docs/claude-code/official-skills.md](docs/claude-code/official-skills.md) への反映を検討してください。`,
              ``,
              ...(newSkills.length ? [`### 新しいスキル (${newSkills.length} 件)`, ``, newList, ``] : []),
              ...(removedSkills.length ? [`### upstream から消えたスキル (${removedSkills.length} 件)`, ``, `統合・改名の可能性もあるため、upstream の commit 履歴で経緯を確認してください。`, ``, removedList, ``] : []),
              `---`,
              ``,
              `### 対応方法`,
              ``,
              `1. 追加は \`SKILL.md\` を確認し、\`docs/claude-code/official-skills.md\` に解説を追加する`,
              `2. 削除は経緯を確認し、該当する解説を外すか後継へ差し替える`,
              `3. \`scripts/known-files.json\` の \`anthropics_skills\` リストを更新する`,
              `4. \`CHANGELOG.md\` に更新内容を1行追記する`,
              ``,
              `> このIssueは [check-anthropics-skills-updates](../../actions/workflows/check-anthropics-skills-updates.yml) ワークフローにより自動生成されました。`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[更新通知] anthropics/skills に追加 ${newSkills.length} 件・削除 ${removedSkills.length} 件 (${new Date().toISOString().split('T')[0]})`,
              body,
              labels: ['upstream-update', 'documentation'],
            });

            console.log(`Issue created: ${newSkills.length} new / ${removedSkills.length} removed`);

      - name: 追加・削除なし（スキップ）
        if: steps.check.outputs.has_new_skills != 'true' && steps.check.outputs.has_removed_skills != 'true'
        run: echo "追加・削除はありませんでした。"