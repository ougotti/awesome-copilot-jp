name: 手動追従 upstream の更新チェック

on:
  schedule:
    # 毎週月曜 09:30 JST (00:30 UTC) に実行
    - cron: '30 0 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run（Issue を作成しない）'
        required: false
        default: 'false'
        type: boolean

jobs:
  check-updates:
    name: openai/plugins ほか 5 リポジトリの追加・削除をチェック
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v5

      - name: Python セットアップ
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 更新チェックスクリプトを実行
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRACKED_FILE: scripts/known-files.json
        run: python scripts/check_dev_methods_updates.py

      - name: 追加・削除がある場合 Issue を作成
        if: (steps.check.outputs.has_new_items == 'true' || steps.check.outputs.has_removed_items == 'true') && inputs.dry_run != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('dev_methods_report.json', 'utf8'));

            const sections = [];
            let total = 0;
            let totalRemoved = 0;

            for (const [key, target] of Object.entries(report)) {
              const added = target.new || [];
              const removed = target.removed || [];
              if (added.length === 0 && removed.length === 0) continue;
              total += added.length;
              totalRemoved += removed.length;

              const items = [
                ...added.map(p => `- 追加: [\`${p}\`](https://github.com/${target.repo}/tree/main/${p})`),
                ...removed.map(p => `- 削除: \`${p}\` （upstream に存在しない）`),
              ].join('\n');

              sections.push([
                `### ${target.repo}（追加 ${added.length} 件・削除 ${removed.length} 件）`,
                ``,
                `対応 docs: [${target.label}](${target.docs})`,
                `\`scripts/known-files.json\` の更新キー: \`${key}\``,
                ``,
                items,
                ``,
              ].join('\n'));
            }

            const body = [
              `## 手動追従の upstream に追加・削除がありました`,
              ``,
              `手動追従の upstream で、追加 **${total} 件**・削除 **${totalRemoved} 件**を検出しました。`,
              `各リポジトリの対応 docs ページへの反映を検討してください。`,
              ``,
              ...sections,
              `---`,
              ``,
              `### 対応方法`,
              ``,
              `1. 上記の \`SKILL.md\`・\`plugin.json\`（または拡張のルールファイル）を確認する`,
              `2. 対応 docs ページに解説を追加する`,
              `3. 削除は経緯（統合・改名・削除）を upstream の commit 履歴で確認し、対応 docs の記述を外すか後継へ差し替える`,
              `4. \`scripts/known-files.json\` の該当キーを更新する`,
              `5. \`CHANGELOG.md\` と README の「🆕 最近の更新」に1行追記する`,
              ``,
              `> このIssueは [check-dev-methods-updates](../../actions/workflows/check-dev-methods-updates.yml) ワークフローにより自動生成されました。`,
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[更新通知] 手動追従 upstream に追加 ${total} 件・削除 ${totalRemoved} 件 (${new Date().toISOString().split('T')[0]})`,
              body,
              labels: ['upstream-update', 'documentation'],
            });

            console.log(`Issue created: ${total} new / ${totalRemoved} removed`);

      - name: 追加・削除なし（スキップ）
        if: steps.check.outputs.has_new_items != 'true' && steps.check.outputs.has_removed_items != 'true'
        run: echo "追加・削除はありませんでした。"
